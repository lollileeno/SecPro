<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vulnerable Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<header>
         <nav>
            <ul>
            <li><img src="https://static.vecteezy.com/system/resources/thumbnails/025/733/420/small/shield-coat-arms-design-elements-png.png" width="70px" height="70px"></li>
            <li><a href="/"> Home </a></li>
            <li><a href="/login"> Vulnerable login </a></li>
            <li><a href="/secure_login"> Secure login </a></li>
            </ul>
        </nav>
    </header>

<div class="container">
    <h2 style="color:rgb(234, 4, 4);">Vulnerable Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <p style="color: {% if category == 'danger' %}red{% else %}green{% endif %}; font-weight: bold; margin-bottom: 10px;">
        {{ message }}
      </p>
    {% endfor %}
  {% endif %}
{% endwith %}

    <form method="POST">
        <input type="text" name="username" placeholder="Enter Username" required>
        <input type="text" name="password" placeholder="Enter Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register">Create account</a>
</div>

</body>
</html>
