<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="nav">
    <a href="/">Home</a>
    <a href="/logout">Logout</a>
</div>

<div class="container">
    <h2>Welcome, {{ user }}</h2>

    <a href="/admin">Vulnerable Admin</a>
    <a href="/secure_admin">Secure Admin</a>

    <hr style="margin: 20px 0;">
<h3>Leave a Comment</h3>

<form method="POST" action="/add_comment">
    <textarea name="content" placeholder="Write something..." required style="width: 100%; height: 60px; margin-bottom: 10px;"></textarea>
    <button type="submit">Post Comment</button>
</form>

<h3 style="margin-top: 20px;">Recent Comments:</h3>
<ul style="text-align: left; background: #eee; padding: 10px; list-style-type: none;">
    {% for comment in comments %}
        <li style="margin-bottom: 5px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">
            {{ comment[0] | safe }}
        </li>
    {% endfor %}
</ul>
</div>

</body>
</html>
