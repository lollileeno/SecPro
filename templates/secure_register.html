<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Register</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
         <nav>
            <ul>
            <li><a href="/"> Home </a></li>
            <li><a href="/register"> Vulnerable register </a></li>
            <li><a href="/secure_login"> Secure register </a></li>
            </ul>
        </nav>
    </header>


<div class="container">
    <h2 style="color:green;">Secure Register</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div id="flash-popup-container" style="width: 100%; margin-bottom: 20px;">
          {% for category, message in messages %}
            <div style="
                padding: 15px; 
                border-radius: 12px; 
                margin-bottom: 10px; 
                font-weight: bold;
                text-align: center;
                border: 2px solid {% if category == 'danger' %}#dc3545{% else %}#198754{% endif %};
                background-color: {% if category == 'danger' %}#f8d7da{% else %}#d1e7dd{% endif %};
                color: {% if category == 'danger' %}#721c24{% else %}#0f5132{% endif %};
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
                animation: fadeIn 0.5s ease-in-out;">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
    <form method="POST" action="/secure_register">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Register Secure</button>
    </form>
</div>

</body>
</html>
